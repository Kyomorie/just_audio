name: P2 Android confirmed seek hardening

on:
  push:
    branches:
      - automation/p2-confirmed-seek
    paths:
      - '.github/workflows/p2-android-confirmed-seek-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/p2-confirmed-seek
          fetch-depth: 0

      - name: Verify candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "025f02bf0c2940c000a7e3764b94e81e3e20f136"
          test -z "$(git diff --name-only c3ea3d43c84ab527668df9099b006ae22d3887c9...HEAD | grep -v '^\.github/')"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        shell: bash
        run: |
          (cd just_audio_platform_interface && flutter pub get --no-example)
          (cd just_audio && flutter pub get --no-example)
          git checkout -- just_audio_platform_interface/analysis_options.yaml just_audio/analysis_options.yaml

      - name: Apply Android hardening
        shell: bash
        run: |
          python3 .github/scripts/harden-p2-android-confirmed-seek.py
          git diff --check
          test "$(git diff --name-only | grep -v '^\.github/')" = "just_audio/android/src/main/java/com/ryanheise/just_audio/AudioPlayer.java"
          grep -q 'completeConfirmedSeekReached(newPosition)' just_audio/android/src/main/java/com/ryanheise/just_audio/AudioPlayer.java
          grep -q 'newPosition.positionMs' just_audio/android/src/main/java/com/ryanheise/just_audio/AudioPlayer.java

      - name: Analyze and test
        working-directory: just_audio
        run: |
          flutter analyze lib test --no-fatal-warnings
          flutter test

      - name: Create Android smoke host
        run: flutter create --platforms=android --org dev.kyomorie /tmp/p2_android_hardened

      - name: Point smoke host at candidate
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE"
          cat > /tmp/p2_android_hardened/pubspec.yaml <<EOF
          name: p2_android_hardened
          publish_to: none
          environment:
            sdk: ">=3.1.3 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            just_audio:
              path: $ROOT/just_audio
          flutter:
            uses-material-design: true
          EOF
          cat > /tmp/p2_android_hardened/lib/main.dart <<'EOF'
          import 'package:flutter/widgets.dart';
          import 'package:just_audio/just_audio.dart';
          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            final player = AudioPlayer();
            player.seekConfirmed(const Duration(seconds: 1));
            runApp(const SizedBox.shrink());
          }
          EOF

      - name: Android debug compile
        working-directory: /tmp/p2_android_hardened
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Commit exact source change
        shell: bash
        run: |
          git checkout -- just_audio_platform_interface/analysis_options.yaml just_audio/analysis_options.yaml
          git checkout -- just_audio_platform_interface/pubspec.lock just_audio/pubspec.lock 2>/dev/null || true
          git diff --check
          test "$(git diff --name-only | grep -v '^\.github/')" = "just_audio/android/src/main/java/com/ryanheise/just_audio/AudioPlayer.java"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add just_audio/android/src/main/java/com/ryanheise/just_audio/AudioPlayer.java
          git commit -m "fix: bind confirmed seek to Media3 discontinuity"
          git push origin HEAD:automation/p2-confirmed-seek
