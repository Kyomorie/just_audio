name: P1 play dispatch failure hardening

on:
  push:
    branches:
      - automation/p1-just-audio-apply
    paths:
      - .github/workflows/p1-play-dispatch-failure-hardening.yml

permissions: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/backend-playback-ack
          fetch-depth: 2
      - name: Verify exact target head
        shell: bash
        run: |
          expected='c6efa2e1415155a6aad515c7f255602b785883c2'
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$expected" ]] || { echo "Unexpected target head: $actual" >&2; exit 1; }
      - name: Apply fail-closed dispatch outcome
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('just_audio/lib/just_audio.dart')
          text = source.read_text()

          field = '  Completer<void>? _playRequestDispatchCompleter;\n'
          if text.count(field) != 1:
              raise SystemExit('Unexpected dispatch field')
          text = text.replace(
              field,
              '  Completer<bool>? _playRequestDispatchCompleter;\n',
              1,
          )

          old_helper = """  void _completePlayRequestDispatch(Completer<void>? completer) {\n    if (completer != null && !completer.isCompleted) {\n      completer.complete();\n    }\n    if (identical(_playRequestDispatchCompleter, completer)) {\n      _playRequestDispatchCompleter = null;\n    }\n  }\n"""
          new_helper = """  void _completePlayRequestDispatch(\n    Completer<bool>? completer, {\n    required bool dispatched,\n  }) {\n    if (completer != null && !completer.isCompleted) {\n      completer.complete(dispatched);\n    }\n  }\n"""
          if text.count(old_helper) != 1:
              raise SystemExit('Unexpected dispatch helper')
          text = text.replace(old_helper, new_helper, 1)

          old_play = """  Future<void> play() async {\n    if (_disposed) return;\n    if (playing) return;\n    _playInterrupted = false;\n    final playRequestDispatchCompleter = Completer<void>();\n    _playRequestGeneration++;\n    _playRequestDispatchCompleter = playRequestDispatchCompleter;\n    // Broadcast to clients immediately, but revert to false if we fail to\n    // activate the audio session. This allows setAudioSource to be aware of a\n    // prior play request.\n    _playerEventSubject.add(PlayerEvent(\n      playing: true,\n      playbackEvent: playbackEvent.copyWith(\n        updatePosition: position,\n        updateTime: DateTime.now(),\n      ),\n    ));\n    final playCompleter = Completer<dynamic>();\n    try {\n      final audioSession = await AudioSession.instance;\n      if (!_handleAudioSessionActivation ||\n          await audioSession.setActive(true)) {\n        if (!playing) {\n          _completePlayRequestDispatch(playRequestDispatchCompleter);\n          return;\n        }\n        // TODO: rewrite this to more cleanly handle simultaneous load/play\n        // requests which each may result in platform play requests.\n        final requireActive = _playlist.children.isNotEmpty;\n        if (requireActive) {\n          if (_active) {\n            // If the native platform is already active, send it a play request.\n            // NOTE: If a load() request happens simultaneously, this may result\n            // in two play requests being sent. The platform implementation should\n            // ignore the second play request since it is already playing.\n            _sendPlayRequest(\n              await _platform,\n              playCompleter,\n              playRequestDispatchCompleter: playRequestDispatchCompleter,\n            );\n          } else {\n            // If the native platform wasn't already active, activating it will\n            // implicitly restore the playing state and send a play request.\n            final activation = _setPlatformActive(\n              true,\n              playCompleter: playCompleter,\n              playRequestDispatchCompleter: playRequestDispatchCompleter,\n            );\n            if (activation != null) {\n              unawaited(activation.whenComplete(() {\n                _completePlayRequestDispatch(playRequestDispatchCompleter);\n              }).catchError((dynamic e) async => null));\n            } else {\n              _completePlayRequestDispatch(playRequestDispatchCompleter);\n            }\n          }\n        } else {\n          _completePlayRequestDispatch(playRequestDispatchCompleter);\n        }\n      } else {\n        // Revert if we fail to activate the audio session.\n        _playerEventSubject.add(playerEvent.copyWith(playing: false));\n        _completePlayRequestDispatch(playRequestDispatchCompleter);\n      }\n    } catch (_) {\n      _completePlayRequestDispatch(playRequestDispatchCompleter);\n      rethrow;\n    }\n    await playCompleter.future;\n  }\n"""
          new_play = """  Future<void> play() async {\n    if (_disposed) return;\n    if (playing) return;\n    _playInterrupted = false;\n    final playRequestDispatchCompleter = Completer<bool>();\n    _playRequestGeneration++;\n    _playRequestDispatchCompleter = playRequestDispatchCompleter;\n    // Broadcast to clients immediately, but revert to false if we fail to\n    // activate the audio session. This allows setAudioSource to be aware of a\n    // prior play request.\n    _playerEventSubject.add(PlayerEvent(\n      playing: true,\n      playbackEvent: playbackEvent.copyWith(\n        updatePosition: position,\n        updateTime: DateTime.now(),\n      ),\n    ));\n    final playCompleter = Completer<dynamic>();\n    try {\n      final audioSession = await AudioSession.instance;\n      if (!_handleAudioSessionActivation ||\n          await audioSession.setActive(true)) {\n        if (!playing) {\n          _completePlayRequestDispatch(\n            playRequestDispatchCompleter,\n            dispatched: false,\n          );\n          if (!playCompleter.isCompleted) playCompleter.complete();\n          return;\n        }\n        // TODO: rewrite this to more cleanly handle simultaneous load/play\n        // requests which each may result in platform play requests.\n        final requireActive = _playlist.children.isNotEmpty;\n        if (requireActive) {\n          if (_active) {\n            // If the native platform is already active, send it a play request.\n            // NOTE: If a load() request happens simultaneously, this may result\n            // in two play requests being sent. The platform implementation should\n            // ignore the second play request since it is already playing.\n            _sendPlayRequest(\n              await _platform,\n              playCompleter,\n              playRequestDispatchCompleter: playRequestDispatchCompleter,\n            );\n          } else {\n            // If the native platform wasn't already active, activating it will\n            // implicitly restore the playing state and send a play request.\n            final activation = _setPlatformActive(\n              true,\n              playCompleter: playCompleter,\n              playRequestDispatchCompleter: playRequestDispatchCompleter,\n            );\n            if (activation != null) {\n              unawaited(activation.then<void>(\n                (_) {\n                  if (!playRequestDispatchCompleter.isCompleted) {\n                    _completePlayRequestDispatch(\n                      playRequestDispatchCompleter,\n                      dispatched: false,\n                    );\n                    if (!playCompleter.isCompleted) playCompleter.complete();\n                  }\n                },\n                onError: (Object error, StackTrace stackTrace) {\n                  _completePlayRequestDispatch(\n                    playRequestDispatchCompleter,\n                    dispatched: false,\n                  );\n                  if (!playCompleter.isCompleted) {\n                    playCompleter.completeError(error, stackTrace);\n                  }\n                },\n              ));\n            } else {\n              _completePlayRequestDispatch(\n                playRequestDispatchCompleter,\n                dispatched: false,\n              );\n              if (!playCompleter.isCompleted) playCompleter.complete();\n            }\n          }\n        } else {\n          _completePlayRequestDispatch(\n            playRequestDispatchCompleter,\n            dispatched: false,\n          );\n          if (!playCompleter.isCompleted) playCompleter.complete();\n        }\n      } else {\n        // Revert if we fail to activate the audio session.\n        _playerEventSubject.add(playerEvent.copyWith(playing: false));\n        _completePlayRequestDispatch(\n          playRequestDispatchCompleter,\n          dispatched: false,\n        );\n        if (!playCompleter.isCompleted) playCompleter.complete();\n      }\n    } catch (_) {\n      _completePlayRequestDispatch(\n        playRequestDispatchCompleter,\n        dispatched: false,\n      );\n      rethrow;\n    }\n    await playCompleter.future;\n  }\n"""
          if text.count(old_play) != 1:
              raise SystemExit('Unexpected play implementation')
          text = text.replace(old_play, new_play, 1)

          old_pause = """    _playRequestGeneration++;\n    _completePlayRequestDispatch(_playRequestDispatchCompleter);\n"""
          new_pause = """    _playRequestGeneration++;\n    _completePlayRequestDispatch(\n      _playRequestDispatchCompleter,\n      dispatched: false,\n    );\n"""
          if text.count(old_pause) != 2:
              raise SystemExit('Unexpected pause/stop dispatch settlements')
          text = text.replace(old_pause, new_pause, 2)

          old_wait = """    final playRequestGeneration = _playRequestGeneration;\n    final playRequestDispatchCompleter = _playRequestDispatchCompleter;\n    if (playRequestDispatchCompleter != null &&\n        !playRequestDispatchCompleter.isCompleted) {\n      await playRequestDispatchCompleter.future;\n    }\n    if (_disposed) {\n      return const PlaybackStartResult(\n        PlaybackStartStatus.failed,\n        errorMessage: 'Player disposed',\n      );\n    }\n    if (_playRequestGeneration != playRequestGeneration || !playing) {\n      return const PlaybackStartResult(PlaybackStartStatus.superseded);\n    }\n\n    try {\n"""
          new_wait = """    final playRequestGeneration = _playRequestGeneration;\n    final playRequestDispatchCompleter = _playRequestDispatchCompleter;\n    final playRequestDispatched = playRequestDispatchCompleter == null\n        ? null\n        : await playRequestDispatchCompleter.future;\n    if (_disposed) {\n      return const PlaybackStartResult(\n        PlaybackStartStatus.failed,\n        errorMessage: 'Player disposed',\n      );\n    }\n    if (_playRequestGeneration != playRequestGeneration || !playing) {\n      return const PlaybackStartResult(PlaybackStartStatus.superseded);\n    }\n    if (playRequestDispatched == false) {\n      return const PlaybackStartResult(\n        PlaybackStartStatus.failed,\n        errorMessage: 'Native play request was not dispatched',\n      );\n    }\n\n    try {\n"""
          if text.count(old_wait) != 1:
              raise SystemExit('Unexpected wait barrier')
          text = text.replace(old_wait, new_wait, 1)

          old_send = """  Future<void> _sendPlayRequest(\n    AudioPlayerPlatform platform,\n    Completer<void>? playCompleter, {\n    Completer<void>? playRequestDispatchCompleter,\n  }) async {\n    try {\n      if (!playing) {\n        _completePlayRequestDispatch(playRequestDispatchCompleter);\n        return;\n      }\n      _completePlayRequestDispatch(playRequestDispatchCompleter);\n      await platform.play(PlayRequest());\n      playCompleter?.complete();\n    } catch (e, stackTrace) {\n      playCompleter?.completeError(e, stackTrace);\n    }\n  }\n"""
          new_send = """  Future<void> _sendPlayRequest(\n    AudioPlayerPlatform platform,\n    Completer<void>? playCompleter, {\n    Completer<bool>? playRequestDispatchCompleter,\n  }) async {\n    try {\n      if (!playing) {\n        _completePlayRequestDispatch(\n          playRequestDispatchCompleter,\n          dispatched: false,\n        );\n        return;\n      }\n      final playFuture = platform.play(PlayRequest());\n      _completePlayRequestDispatch(\n        playRequestDispatchCompleter,\n        dispatched: true,\n      );\n      await playFuture;\n      playCompleter?.complete();\n    } catch (e, stackTrace) {\n      playCompleter?.completeError(e, stackTrace);\n    }\n  }\n"""
          if text.count(old_send) != 1:
              raise SystemExit('Unexpected sendPlayRequest implementation')
          text = text.replace(old_send, new_send, 1)

          old_signature = """    Completer<void>? playCompleter,\n    Completer<void>? playRequestDispatchCompleter,\n    bool force = false,\n"""
          new_signature = """    Completer<void>? playCompleter,\n    Completer<bool>? playRequestDispatchCompleter,\n    bool force = false,\n"""
          if text.count(old_signature) != 1:
              raise SystemExit('Unexpected setPlatformActive signature')
          text = text.replace(old_signature, new_signature, 1)
          source.write_text(text)

          test = Path('just_audio/test/just_audio_test.dart')
          t = test.read_text()

          mock_fields = """  MockAudioPlayer? mostRecentPlayer;\n  final _players = <String, MockAudioPlayer>{};\n"""
          mock_fields_new = """  MockAudioPlayer? mostRecentPlayer;\n  final _players = <String, MockAudioPlayer>{};\n  bool failNextInit = false;\n  int initCallCount = 0;\n"""
          if t.count(mock_fields) != 1:
              raise SystemExit('Unexpected MockJustAudio fields')
          t = t.replace(mock_fields, mock_fields_new, 1)

          init_anchor = """  Future<AudioPlayerPlatform> init(InitRequest request) async {\n    if (_players.containsKey(request.id)) {\n"""
          init_new = """  Future<AudioPlayerPlatform> init(InitRequest request) async {\n    initCallCount++;\n    if (failNextInit) {\n      failNextInit = false;\n      throw PlatformException(\n        code: 'init_failed',\n        message: 'Injected platform init failure',\n      );\n    }\n    if (_players.containsKey(request.id)) {\n"""
          if t.count(init_anchor) != 1:
              raise SystemExit('Unexpected MockJustAudio init')
          t = t.replace(init_anchor, init_new, 1)

          anchor = """  test('playback start acknowledgment rejects without play intent', () async {\n"""
          new_test = """  test('playback start acknowledgment fails closed before native dispatch',\n      () async {\n    final player = AudioPlayer(handleAudioSessionActivation: false);\n    await player.setUrl('https://foo.foo/foo.mp3', preload: false);\n    final initCallsBefore = mock.initCallCount;\n    final previousPlatform = mock.mostRecentPlayer;\n    final previousPlayCalls = previousPlatform?.playCallCount;\n    final previousAckCalls = previousPlatform?.awaitPlaybackStartCallCount;\n    mock.failNextInit = true;\n\n    final playFuture = player.play();\n    final playExpectation =\n        expectLater(playFuture, throwsA(isA<PlatformException>()));\n    final result = await player.waitForPlaybackStart();\n    await playExpectation;\n\n    expect(result.status, PlaybackStartStatus.failed);\n    expect(result.started, isFalse);\n    expect(result.errorMessage, contains('not dispatched'));\n    expect(mock.initCallCount, initCallsBefore + 1);\n    expect(mock.failNextInit, isFalse);\n    expect(mock.mostRecentPlayer, same(previousPlatform));\n    expect(previousPlatform?.playCallCount, previousPlayCalls);\n    expect(previousPlatform?.awaitPlaybackStartCallCount, previousAckCalls);\n\n    await player.stop();\n    await player.dispose();\n  });\n\n  test('playback start acknowledgment rejects without play intent', () async {\n"""
          if t.count(anchor) != 1:
              raise SystemExit('Unexpected playback ack test anchor')
          test.write_text(t.replace(anchor, new_test, 1))
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve language version
        working-directory: just_audio
        shell: bash
        run: |
          flutter pub get --no-example
          git checkout -- analysis_options.yaml
      - name: Format and exact scope gate
        shell: bash
        run: |
          dart format just_audio/lib/just_audio.dart just_audio/test/just_audio_test.dart
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' just_audio/lib/just_audio.dart just_audio/test/just_audio_test.dart | sort)"
          [[ "$actual" == "$expected" ]] || { printf 'Unexpected changed paths:\n%s\n' "$actual" >&2; exit 1; }
      - name: Analyze and run full just_audio test file
        working-directory: just_audio
        shell: bash
        run: |
          flutter analyze lib --no-fatal-warnings 2>&1 | tee /tmp/analyze.txt
          python3 <<'PY'
          from pathlib import Path
          import re
          issues = [line for line in Path('/tmp/analyze.txt').read_text().splitlines() if re.match(r'^\s*(error|warning|info) •', line)]
          if len(issues) != 1 or 'warning •' not in issues[0] or 'unawaited_return_in_try_block' not in issues[0]:
              raise SystemExit(f'Unexpected analyzer issues: {issues}')
          PY
          flutter test test/just_audio_test.dart
      - name: Restore side effects and revalidate scope
        shell: bash
        run: |
          git checkout -- just_audio/analysis_options.yaml
          rm -rf just_audio/.dart_tool
          rm -f just_audio/pubspec.lock
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' just_audio/lib/just_audio.dart just_audio/test/just_audio_test.dart | sort)"
          [[ "$actual" == "$expected" ]] || { printf 'Unexpected changed paths after validation:\n%s\n' "$actual" >&2; exit 1; }
      - name: Commit validated fail-closed hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add just_audio/lib/just_audio.dart just_audio/test/just_audio_test.dart
          git commit -m 'fix: fail closed before native play dispatch'
      - name: Push only if target is unchanged
        shell: bash
        run: |
          expected='c6efa2e1415155a6aad515c7f255602b785883c2'
          remote_head="$(git ls-remote origin refs/heads/feat/backend-playback-ack | cut -f1)"
          [[ "$remote_head" == "$expected" ]] || { echo "Target moved externally: $remote_head" >&2; exit 1; }
          [[ "$(git rev-parse HEAD^)" == "$expected" ]] || { echo 'Unexpected parent' >&2; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { git status --short >&2; exit 1; }
          git push origin HEAD:refs/heads/feat/backend-playback-ack
